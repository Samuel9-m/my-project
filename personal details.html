<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>SAMUEL WESONGA | PERSONAL DETAILS WEBPAGE</title>
   <style>
      :root {
         --lightblue: #add8e6;
         --dark: #14213d;
         --green: #0a6b1f;
      }

      * { box-sizing: border-box; }

      body {
         margin: 0;
         display: flex;
         flex-direction: column;
         min-height: 100vh;
         background: var(--lightblue);
         color: var(--dark);
         font-family: "Segoe UI", Arial, sans-serif;
         line-height: 1.8;
      }

      header, main, footer { padding: 20px 48px; }

      main { flex: 1; }

      h1 {
         margin: 0;
         font-size: clamp(1.4rem, 4vw, 2.2rem);
         font-weight: 800;
      }

      hr {
         border: none;
         border-top: 3px solid var(--dark);
         margin: 0 0 24px 0;
      }

      h2 {
         margin: 0 0 16px 0;
         font-size: 1.5rem;
         display: inline-block;
         border-bottom: 3px solid var(--dark);
         padding-bottom: 3px;
      }

      p { margin: 0 0 14px 0; max-width: 750px; font-size: 1.1rem; }

      .links {
         display: flex;
         gap: 14px;
         margin-top: 30px;
      }

      .links a {
         display: inline-block;
         padding: 10px 28px;
         border: 3px solid var(--dark);
         border-radius: 50px;
         color: var(--dark);
         text-decoration: none;
         font-weight: 700;
         transition: background 0.25s ease, color 0.25s ease, transform 0.25s ease;
      }

      .links a:hover {
         background: var(--dark);
         color: var(--lightblue);
         transform: translateY(-3px);
      }

      .links a.home {
         background: var(--dark);
         color: var(--lightblue);
      }

      .links a.home:hover {
         background: transparent;
         color: var(--dark);
      }

      footer {
         border-top: 3px solid var(--dark);
         text-align: center;
      }

      footer p {
         margin: 0 auto;
         color: var(--green);
         font-weight: 700;
      }
   </style>
</head>
<body>

   <header>
      <h1>HI, I AM SAMUEL WESONGA. WELCOME TO MY CV WEBSITE</h1>
   </header>

   <main>
      <hr>

      <h2>PERSONAL DETAILS</h2>

      <p>
         I am Samuel Wesonga, a second-year student at Kisii University,
         pursuing a Bachelor of
         <i><b>Information Science and Technology</b></i>.
      </p>

      <p>
         I stay in Kisii Municipality, near Kisii Main Campus.
      </p>

      <div class="links">
         <a class="home" href="index.html">&#8962; Home</a>
         <a href="home.html">&larr; Back</a>
      </div>
   </main>

   <footer>
      <p>&copy; 2026 Samuel Wesonga</p>
   </footer>

</body>
</html>
