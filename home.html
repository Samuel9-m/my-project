<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>My CV Webpages</title>
   <style>
      /* Same two colours as the home page */
      :root {
         --yellow: #ffd60a;
         --dark: #14213d;
         --lightblue: #add8e6;
      }

      * { box-sizing: border-box; }

      body {
         margin: 0;
         background: var(--lightblue);
         color: var(--dark);
         font-family: "Segoe UI", Arial, sans-serif;
         line-height: 1.8;
      }

      .container {
         width: 100%;
         padding: 40px 48px 60px;
      }

      h1 {
         margin: 0 0 8px 0;
         font-size: clamp(1.6rem, 4vw, 2.6rem);
         font-weight: 800;
         line-height: 1.3;
      }

      hr {
         border: none;
         border-top: 3px solid var(--dark);
         margin: 20px 0 30px 0;
      }

      h2 {
         margin: 0 0 20px 0;
         font-size: 1.4rem;
         letter-spacing: 1px;
         display: inline-block;
         border-bottom: 3px solid var(--dark);
         padding-bottom: 3px;
      }

      /* Navigation links as simple buttons */
      nav ul {
         list-style: none;
         margin: 0;
         padding: 0;
         display: flex;
         flex-direction: column;
         align-items: flex-start;
         gap: 14px;
      }

      nav a {
         display: inline-block;
         padding: 12px 30px;
         border: 3px solid var(--dark);
         border-radius: 50px;
         color: var(--dark);
         text-decoration: none;
         font-weight: 700;
         transition: background 0.25s ease, color 0.25s ease, transform 0.25s ease;
      }

      nav a:hover {
         background: var(--dark);
         color: var(--yellow);
         transform: translateX(8px);
      }

      /* Home link is filled so it stands out */
      nav a.home {
         background: var(--dark);
         color: var(--yellow);
      }

      nav a.home:hover {
         background: var(--lightblue);
         color: var(--dark);
      }

      .gap { margin-top: 36px; }
   </style>
</head>
<body>
   <div class="container">

      <header>
         <h1>HI, I AM SAMUEL WESONGA. WELCOME TO MY CV WEBSITE</h1>
         <hr>
         <h2>MY CURRICULUM VITAE</h2>
      </header>

      <nav>
         <ul>
            <li><a class="home" href="index.html">Home</a></li>
         </ul>

         <ul class="gap">
            <li><a href="personal details.html">Personal Details</a></li>
            <li><a href="educational background.html">My Educational Background</a></li>
            <li><a href="skills.html">Hobbis</a></li>
            <li><a href="experience.html">My Experience</a></li>
            <li><a href="contacts.html">My Contacts</a></li>
         </ul>
      </nav>

   </div>
</body>
</html>
